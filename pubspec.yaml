name: route_simulator
description: "Pure Dart GPS route simulator: realistic fake location streams along a route with speed profiles, stops, seeded noise, signal loss, a virtual clock, GPX export and Android emulator playback."
version: 0.1.0
homepage: https://github.com/AbdurrahmanKaraoglu/RouteSimulator
repository: https://github.com/AbdurrahmanKaraoglu/RouteSimulator
issue_tracker: https://github.com/AbdurrahmanKaraoglu/RouteSimulator/issues

environment:
  sdk: ^3.8.0

dev_dependencies:
  fake_async: ^1.3.3
  lints: ^6.0.0
  test: ^1.26.0

executables:
  route_simulator_emulator: emulator

topics:
  - gps
  - location
  - simulation
  - testing
  - mock
